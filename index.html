<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<title>티켓 보관함</title>
<meta id="metaTheme" name="theme-color" content="#ffffff">
<meta id="metaScheme" name="color-scheme" content="only light">
<script>/* 첫 페인트 전 테마 (FOUC 방지) */(function(){var t=false;document.documentElement.setAttribute('data-theme',t?'dark':'light');document.getElementById('metaTheme').content=t?'#17171a':'#ffffff';})();</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="티켓 보관함">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css?v=43">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app" id="app">
  <div class="ambient" id="ambient"></div>

  <!-- 홈 -->
  <section class="scr" id="scr-home">
    <div class="tb"><div class="logo"><small id="hdSum" style="font-size:13px;font-weight:700;margin:0"></small></div><div style="display:flex;align-items:center;gap:8px"><span class="vbg" id="homeBgBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>배경</span><span class="vbg pri" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>추가</span><div class="pill" id="syncPill">동기화 됨</div></div></div>
    <div class="pendbar" id="pendBanner" hidden></div>
    <div class="scroll" id="homeBody"></div>
    <div class="selectbar" id="selectBar" hidden></div>
  </section>

  <!-- 보관함 -->
  <section class="scr" id="scr-vault" hidden>
    <div class="vtop"><span class="vbg" id="bgBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>배경</span><span class="vmode" id="modeBtn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg><em id="modeLbl">타임라인</em></span></div>
    <div class="stage" id="stage"></div>
    <div class="dock"><div class="tl"><div class="tlin" id="tl"></div></div><div class="prog" id="prog"><div class="trk" id="trk"></div><div class="fill" id="fill"></div><div class="mk" id="mk"></div></div><div class="msum" id="msum"></div></div>
    <div class="shows" id="shows"></div>
  </section>

  <!-- 결산 -->
  <section class="scr" id="scr-money" hidden>
    <div class="tb"><div class="logo"><b>결산</b><small>전체 기간</small></div></div>
    <div class="scroll" id="moneyBody"></div>
  </section>

  <!-- 설정 -->
  <section class="scr" id="scr-set" hidden>
    <div class="tb"><div class="logo"><b>설정</b><small>티켓 보관함</small></div></div>
    <div class="scroll" id="setBody"></div>
  </section>

  <div class="nav" id="nav">
    <div class="on" data-scr="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span>홈</span></div>
    <div data-scr="vault"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4z"></path></svg><span>보관함</span></div>
    <div data-scr="money"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-8M22 19H2"></path></svg><span>결산</span></div>
    <div data-scr="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg><span>설정</span></div>
  </div>

  <!-- 오버레이 -->
  <div class="viewer" id="viewer"><div class="vx" id="viewerX">✕</div><div class="img"></div></div>
  <div class="scrim" id="scrim"></div>
  <div class="subscrim" id="subscrim"></div>
  <div class="sub" id="sub"><div class="grab"></div><h2 id="subT"></h2><div class="body" id="subB"></div><div class="foot" id="subF"></div></div>
  <div class="dsheet" id="dsheet"><div class="dhd"><div class="x" id="dClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div><div class="act" id="dAct"></div></div><div class="dbody" id="dBody"></div><div class="dfoot" id="dFoot"></div></div>
  <div class="toast" id="toast"></div>

  <input type="file" id="aiFile" accept="image/*" multiple hidden>
  <input type="file" id="imgFile" accept="image/*" hidden>
  <input type="file" id="pendFile" accept="image/*" hidden>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>
<script type="module" src="app.js?v=43"></script>
</body>
</html>
