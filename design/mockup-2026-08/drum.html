<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>티켓 보관함 — 타임라인 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Nanum+Myeongjo:wght@700;800&family=Song+Myung&family=Do+Hyeon&family=Jua&family=Gowun+Batang:wght@400;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Noto+Serif+KR:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=Share+Tech+Mono&family=Chakra+Petch:wght@600;700&display=swap">
<style>
  :root{
    --bg:#101114; --sur:#17181c; --line:rgba(255,255,255,.08);
    --ink:#f2f3f5; --ink-2:rgba(242,243,245,.68); --ink-3:rgba(242,243,245,.42);
    --accent:#ff6a3d; --good:#3ddc84; --card-w:252px; --card-h:326px;
    --r:16px; --r-s:6px; --fd:inherit; --fn:inherit; --badge-bg:#fff; --badge-ink:#0b0b0e; --card-shadow:0 20px 40px -18px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overscroll-behavior:none}
  .app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
  /* header (컴팩트) */
  .hd{padding:max(14px,env(safe-area-inset-top)) 18px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
  .hd .n{font-family:var(--fd);font-size:20px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .hd .n small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:6px;letter-spacing:-.02em}
  .hd .s{margin-top:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
  .hd .s b{color:var(--accent);font-weight:800}
  .ib{width:36px;height:36px;border-radius:50%;background:var(--sur);border:1px solid var(--line);display:grid;place-items:center}
  .ib svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ib.on{background:var(--ink);border-color:var(--ink)}.ib.on svg{stroke:var(--bg)}
  .bar{display:none}
  .bar span{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:5px 9px;border-radius:7px;background:var(--sur);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
  .bar span.on{color:#fff;border-color:rgba(255,255,255,.3)}
  .bar .mode{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:#fff}
  .bar .mode svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  /* stage */
  .stage{position:relative;flex:1;min-height:0;perspective:900px;perspective-origin:50% 40%;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
  .card{position:absolute;left:50%;top:50%;width:var(--card-w);height:var(--card-h);margin:calc(var(--card-h) / -2) 0 0 calc(var(--card-w) / -2);transform-origin:50% 0;transform-style:preserve-3d;will-change:transform,opacity,filter}
  .stage.anim .card,.stage.anim .gate{transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .35s,filter .35s}
  .art{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;background:var(--sur);box-shadow:var(--card-shadow),0 0 0 1px var(--line) inset;transform:translateZ(0)}
  .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .art .fx{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.42) 34%,rgba(0,0,0,0) 56%,rgba(0,0,0,0) 76%,rgba(0,0,0,.7) 100%)}
  .art .dim{position:absolute;inset:0;background:var(--bg);opacity:0}
  .art .sheen{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.07) 50%,rgba(255,255,255,0) 62%);opacity:0;pointer-events:none}
  .fan{position:absolute;inset:0;border-radius:var(--r);background:#1d1e23;box-shadow:0 0 0 1px var(--line) inset}
  .fan.f1{transform:translate3d(0,8px,-12px) scale(.965)} .fan.f2{transform:translate3d(0,16px,-24px) scale(.93)}
  .info{position:absolute;left:14px;right:14px;top:12px;display:flex;flex-direction:column;gap:2px;transform:translateZ(40px);text-shadow:0 8px 20px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.5)}
  .info .r1{display:flex;align-items:center;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:5px;height:20px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap;letter-spacing:0}
  .chip.dd{color:var(--accent)}
  .chip.xf{color:var(--good)}
  .chip.past{color:var(--ink-3)}
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--c,#999)}
  .info .ttl{font-family:var(--fd);font-size:14px;font-weight:800;letter-spacing:-.03em;line-height:1.25;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .when{font-family:var(--fn);margin-top:6px;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .info .seat{margin-top:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
  .bt{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;color:var(--ink-2);transform:translateZ(30px);text-shadow:0 6px 14px rgba(0,0,0,.7)}
  .bt b{color:#fff;font-size:12.5px}
  .bt .k{font-size:10.5px;font-weight:800;color:var(--ink-3);margin-left:6px}
  /* 게이트 */
  .gate{position:absolute;left:50%;top:50%;width:var(--card-w);height:48px;margin:-24px 0 0 calc(var(--card-w) / -2);transform-origin:50% 0;transform-style:preserve-3d;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-radius:calc(var(--r) - 4px);background:var(--sur);box-shadow:0 0 0 1px var(--line) inset;will-change:transform,opacity}
  .gate b{font-family:var(--fd);font-size:20px;font-weight:800;letter-spacing:-.05em;transform:translateZ(24px)}
  .gate span{font-size:11px;font-weight:700;color:var(--ink-2);text-align:right;line-height:1.3;transform:translateZ(14px)}
  .gate.today{box-shadow:0 0 0 1px rgba(255,106,61,.5) inset}
  .gate.today b{color:var(--accent)}
  .gate.pastg b{color:var(--ink-2)}
  /* 하단 독: 월 묶음 레일 + 프로그레스 + 월 요약 */
  .dock{padding:6px 18px 8px;position:relative;z-index:6;display:flex;flex-direction:column;gap:10px}
  .tl{height:66px;overflow:hidden}
  .tlin{display:flex;align-items:flex-end;gap:14px;height:66px;width:max-content;transition:transform .38s cubic-bezier(.32,.72,0,1)}
  .grp{position:relative;height:66px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;cursor:pointer;flex:none;transition:width .38s cubic-bezier(.32,.72,0,1)}
  .grp .stk{position:relative;height:44px;width:100%}
  .grp .th{position:absolute;left:0;bottom:0;width:32px;height:42px;border-radius:var(--r-s);overflow:hidden;background:var(--sur);box-shadow:0 0 0 1px rgba(255,255,255,.12);transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .3s;opacity:.55}
  .grp .th img{width:100%;height:100%;object-fit:cover;display:block}
  .grp .th .x{position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--good);color:#06301a;font-size:7px;font-weight:900;text-align:center;line-height:10px}
  .grp.exp .th{opacity:.8}
  .grp .th.on{opacity:1;box-shadow:0 0 0 1.5px var(--ink)}
  .grp .n{position:absolute;right:-6px;bottom:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--badge-bg);color:var(--badge-ink);font-size:9.5px;font-weight:800;display:grid;place-items:center;transition:opacity .25s}
  .grp.exp .n{opacity:0}
  .grp small{display:block;margin-top:6px;font-size:10px;font-weight:700;color:var(--ink-3);white-space:nowrap}
  .grp .yr{position:absolute;left:0;top:0;font-size:9px;font-weight:800;color:var(--accent);letter-spacing:.02em}
  .grp.exp small{color:var(--ink)}
  .grp.today{width:14px;align-items:center}
  .grp.today .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-bottom:4px}
  .grp.today small{color:var(--accent);font-weight:800}
  /* 프로그레스 */
  .prog{position:relative;height:22px;touch-action:none;cursor:pointer}
  .prog .trk{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
  .prog .seg{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.06)}
  .prog .seg.alt{background:rgba(255,255,255,.12)}
  .prog .fill{position:absolute;left:0;top:9px;height:3px;border-radius:2px;background:var(--ink);transition:none}
  .prog .mk{position:absolute;top:5px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--line)}
  .prog .tk{position:absolute;top:4px;width:1px;height:14px;background:rgba(255,255,255,.22);margin-left:-.5px}
  /* 월 요약 */
  .msum{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:32px}
  .msum b{font-family:var(--fd);font-size:14px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
  .msum .r{font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:right;line-height:1.45;min-width:0}
  .msum .r em{font-style:normal;color:var(--ink);font-weight:700}
  .msum .r .g{color:var(--good);font-weight:800}
  /* 돌아가기 */
  .home{position:absolute;left:50%;bottom:210px;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:.25s;z-index:7;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:#fff;color:#0b0b0e;font-size:12.5px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .home.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .home svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  /* 월별 그리드 */
  .app.m-grid .dock,.app.m-shows .dock{opacity:.35;pointer-events:none}
  .app.m-grid .card,.app.m-grid .gate{transform-origin:50% 0}
  /* 공연별 */
  .shows{position:absolute;left:0;right:0;top:118px;bottom:0;padding:4px 18px 100px;overflow:auto;opacity:0;pointer-events:none;transition:opacity .3s;z-index:4}
  .app.m-shows .shows{opacity:1;pointer-events:auto}
  .app.m-shows .stage{visibility:hidden}
  .sg{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
  .sg:first-child{border-top:0}
  .sg .st{position:relative;width:84px;height:110px}
  .sg .st img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px}
  .sg .st .b1,.sg .st .b2{position:absolute;inset:0;border-radius:8px;background:#22232a;box-shadow:0 0 0 1px var(--line) inset}
  .sg .st .b1{transform:translate(5px,-5px) rotate(3deg)} .sg .st .b2{transform:translate(10px,-10px) rotate(6deg)}
  .sg .st .n{position:absolute;right:-6px;bottom:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--badge-bg);color:var(--badge-ink);font-size:11.5px;font-weight:800;display:grid;place-items:center}
  .sg h3{margin:0;font-family:var(--fd);font-size:15.5px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
  .sg .m{margin-top:3px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
  .sg .ds{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .sg .ds span{font-size:10.5px;font-weight:800;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.08)}
  .sg .ds span.soon{background:var(--accent);color:#1a0a05}
  .sg .ds span.xf{background:rgba(61,220,132,.18);color:var(--good)}
  .sg .sum{margin-top:6px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
  .sg .sum b{color:var(--good)}
  /* nav */
  .nav{height:calc(64px + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);position:relative;z-index:5}
  .nav div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:10px;font-weight:700}
  .nav div.on{color:var(--ink)}
  .nav svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  /* sheet */
  .sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,0,1);background:var(--sur);border-radius:var(--r) var(--r) 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));z-index:500;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
  .sheet.on{transform:none}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:400}
  .scrim.on{opacity:1;pointer-events:auto}
  .grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 14px}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .kv small{color:var(--ink-3);font-weight:700;font-size:12px}
  .kv b{font-weight:700}
  .btns{display:flex;gap:8px;margin-top:16px}
  .btns div{flex:1;height:46px;border-radius:calc(var(--r) - 4px);display:grid;place-items:center;font-size:14px;font-weight:800;background:rgba(255,255,255,.08)}
  .btns div.pri{background:var(--ink);color:var(--bg)}

  /* ── 테마 시안 ── */
  .ambient{position:absolute;inset:0;opacity:0;transition:opacity .6s,background-image .5s;pointer-events:none;z-index:0}
  /* ── 시안 A · NOIR — 흑백 프로그램북. 명조 + 콘덴스드 숫자, 각진, 흰 액자 ── */
  [data-theme=noir]{--bg:#000;--sur:#0e0e0e;--line:rgba(242,239,232,.16);--ink:#f2efe8;--ink-2:rgba(242,239,232,.66);--ink-3:rgba(242,239,232,.38);--accent:#f2efe8;--good:#cfe8c8;--r:0;--r-s:0;--fd:"Song Myung","Nanum Myeongjo",serif;--fn:"Bebas Neue","Pretendard",sans-serif;--badge-bg:#f2efe8;--badge-ink:#000;--card-shadow:none}
  [data-theme=noir] .hd .n{font-size:26px;font-weight:400;letter-spacing:0}
  [data-theme=noir] .hd .n small{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  [data-theme=noir] .hd .s{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.02em}
  [data-theme=noir] .hd .s b{text-decoration:underline;text-underline-offset:3px}
  [data-theme=noir] .ib{border-radius:0}
  [data-theme=noir] .art{border:5px solid #f2efe8}
  [data-theme=noir] .card:not(.front) .art img{filter:grayscale(1)}
  [data-theme=noir] .art .fx{background:linear-gradient(180deg,rgba(0,0,0,.86) 0%,rgba(0,0,0,.5) 34%,rgba(0,0,0,0) 56%,rgba(0,0,0,0) 74%,rgba(0,0,0,.8) 100%)}
  [data-theme=noir] .info{left:18px;right:18px;top:18px}
  [data-theme=noir] .info .ttl{font-weight:400;font-size:15px}
  [data-theme=noir] .info .when{font-size:34px;font-weight:400;letter-spacing:.02em;margin-top:8px}
  [data-theme=noir] .info .seat{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.02em}
  [data-theme=noir] .chip{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  [data-theme=noir] .bt{left:18px;right:18px;bottom:16px;font-family:"Space Mono",monospace;font-size:10.5px}
  [data-theme=noir] .gate{border:1px solid var(--ink);background:#000}
  [data-theme=noir] .gate b{font-weight:400;font-size:22px}
  [data-theme=noir] .grp .th{box-shadow:0 0 0 1px var(--ink)}
  [data-theme=noir] .grp .th img{filter:grayscale(1)} [data-theme=noir] .grp .th.on img{filter:none}
  [data-theme=noir] .grp small{font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.08em}
  [data-theme=noir] .prog .trk{height:1px;top:10px} [data-theme=noir] .prog .fill{height:1px;top:10px} [data-theme=noir] .prog .mk{width:9px;height:9px;top:6px;box-shadow:none;border-radius:0}
  [data-theme=noir] .msum{border-top:1px solid var(--ink);padding-top:8px}
  [data-theme=noir] .msum b{font-weight:400;font-size:16px}
  [data-theme=noir] .msum .r{font-family:"Space Mono",monospace;font-size:10px}
  [data-theme=noir] .nav{border-top:1px solid var(--ink)} [data-theme=noir] .nav div{font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.08em}
  [data-theme=noir] .grp.today .dot{background:#f2efe8;border-radius:0}[data-theme=noir] .grp.today small{color:#f2efe8}

  /* ── 시안 B · NEON — 콘서트 조명. 보라 무대, 마젠타/시안 네온, 도현체 ── */
  [data-theme=neon]{--bg:#0a0518;--sur:#160c2c;--line:rgba(255,61,242,.28);--ink:#fff;--ink-2:rgba(255,255,255,.72);--ink-3:rgba(255,255,255,.45);--accent:#ff3df2;--good:#38f9d7;--r:24px;--r-s:8px;--fd:"Do Hyeon","Pretendard",sans-serif;--badge-bg:#ff3df2;--badge-ink:#fff;--card-shadow:0 0 0 1.5px rgba(255,61,242,.65),0 0 46px rgba(255,61,242,.35),0 30px 60px -20px rgba(0,0,0,.9)}
  [data-theme=neon] .app{background:radial-gradient(90% 50% at 50% 0%,#2b1057 0%,#0a0518 60%)}
  [data-theme=neon] .hd .n{font-size:26px;font-weight:400;letter-spacing:0;text-shadow:0 0 18px rgba(255,61,242,.6)}
  [data-theme=neon] .hd .s b{text-shadow:0 0 12px rgba(255,61,242,.8)}
  [data-theme=neon] .ib{border-color:rgba(255,61,242,.4)} [data-theme=neon] .ib.on{background:#ff3df2;border-color:#ff3df2;box-shadow:0 0 20px rgba(255,61,242,.7)}
  [data-theme=neon] .info .ttl{font-weight:400;font-size:16px}
  [data-theme=neon] .info .when{font-size:26px;font-weight:400;letter-spacing:0;color:#38f9d7;text-shadow:0 0 14px rgba(56,249,215,.7)}
  [data-theme=neon] .chip.dd{color:#fff;background:#ff3df2;padding:0 8px;border-radius:8px;box-shadow:0 0 16px rgba(255,61,242,.8)}
  [data-theme=neon] .gate{border:1.5px solid rgba(56,249,215,.6);box-shadow:0 0 24px rgba(56,249,215,.25) inset}
  [data-theme=neon] .gate b{font-weight:400;color:#38f9d7;text-shadow:0 0 12px rgba(56,249,215,.7)}
  [data-theme=neon] .grp .th.on{box-shadow:0 0 0 2px #38f9d7,0 0 14px rgba(56,249,215,.8)}
  [data-theme=neon] .grp .n{box-shadow:0 0 12px rgba(255,61,242,.8)}
  [data-theme=neon] .prog .trk{height:5px;top:8px;background:rgba(255,255,255,.08)} [data-theme=neon] .prog .fill{height:5px;top:8px;background:linear-gradient(90deg,#ff3df2,#38f9d7);box-shadow:0 0 12px rgba(255,61,242,.6)} [data-theme=neon] .prog .mk{background:#38f9d7;box-shadow:0 0 0 3px rgba(56,249,215,.25),0 0 14px #38f9d7}
  [data-theme=neon] .msum b{font-weight:400;font-size:16px}

function itemProfit(t){ if(t.xferAll||(t.xfer&&!t.partial)){ const r=t.xferAll?+t.xferAll.price:t.xfer; return Math.round(r-t.price); } if(t.seats&&t.seats.some(x=>x.t)){ const unit=t.price/Math.max(1,t.seats.length); return Math.round(t.seats.filter(x=>x.t).reduce((a,x)=>a+((+x.tp||0)-(t.perSeat&&x.pp!==undefined?+x.pp:unit)),0)); } return null; }

const partMini=t=>{ const h=holdInfo(t); return h.partial?`<span class="mini">양도 ${h.sold}/${h.total}</span>`:''; };
const recvOf=t=>t.xferAll?+t.xferAll.price||0:(t.seats&&t.seats.some(x=>x.t))?t.seats.filter(x=>x.t).reduce((a,x)=>a+(+x.tp||0),0):(t.xfer&&!t.partial?t.xfer:0);

// 프로그레스 트랙: 항목 인덱스 축. 지난 구간은 좁게(가중치 .35)
const trk=document.getElementById('trk'), fillEl=document.getElementById('fill'), mkEl=document.getElementById('mk'), progEl=document.getElementById('prog'), msum=document.getElementById('msum');
const W=[]; { let x=0; for(let i=0;i<N;i++){ W[i]=x; x+= i<TODAY_I?0.35:1; } W[N]=x; }
const fracOf=q=>{ const i=Math.floor(q), f=q-i; const a=W[Math.max(0,Math.min(N,i))], b=W[Math.max(0,Math.min(N,i+1))]; return (a+(b-a)*f)/W[N-1]; };
const posOf=fr=>{ const x=fr*W[N-1]; for(let i=0;i<N-1;i++){ if(x<=W[i+1]) return i+(x-W[i])/(W[i+1]-W[i]); } return N-1; };

groups.forEach((g,k)=>{ if(g.key==='today')return; const sg=document.createElement('div'); sg.className='seg'+(k%2?' alt':''); sg.style.left=(fracOf(g.from)*100)+'%'; sg.style.width=((fracOf(g.to)-fracOf(g.from))*100)+'%'; trk.appendChild(sg); });

// ── 물리 ───────────────────────────────────────────────────────────────
// ponytail: 단순 마찰+스냅. 더 정확한 iOS 감각 필요하면 UIScrollView 감속곡선(0.998^t)로 교체.
let pos=HOME, vel=0, target=null, dragging=false, lastY=0, lastT=0, raf, moved=0, ovScroll=0, ovVel=0, tilt=0, tiltV=0;

function render(){
  tilt+=(tiltV-tilt)*0.18; tiltV*=0.9;
  const H=stage.clientHeight;
  for(let i=0;i<N;i++){
    const d=i-pos, el=els[i], it=ITEMS[i], a=Math.abs(d);
    if(mode==='grid'){
      const p=ovPos[i], y=p.y-ovScroll;
      const natTop=H/2-(it.gate?24:157);
      const ty=(y+16)-natTop;
      el.style.display=(y<-360||y>H+60)?'none':'';
      el.style.transform=`translate3d(${p.x}px,${ty}px,-140px) rotateX(5deg) scale(${p.label?0.92:OV.s})`;
      el.style.opacity=1; el.style.filter=''; el.style.zIndex=String(it.gate?900:500+i);
      if(!it.gate){ el.querySelector('.dim').style.opacity=0; el.querySelector('.sheen').style.opacity=0; }
      continue;
    }
    // 뒤로 3장까지: 간격 좁아지고 점점 연해짐 (뎁스). 지나간 카드는 아래로 빠짐
    if(d>3.4||d<-1.2){ el.style.display='none'; continue; }
    el.style.display='';
    let z,y,op,dim,blur;
    if(d>=0){ const S=34*(1-Math.pow(0.78,d))/(1-0.78); z=-d*70; y=-S; op=Math.max(0,1-d*0.28); dim=Math.min(.7,d*0.3); blur=Math.max(0,Math.min(1.2,(d-1)*0.6)); el.style.zIndex=String(1000-Math.round(d*10)); }
    else{ const q=-d; z=q*30; y=q*300; op=Math.max(0,1-q*1.5); dim=0; blur=0; el.style.zIndex='1200'; }
    el.classList.toggle('front',Math.abs(d)<0.5);
    el.style.setProperty('--glow', d>=0&&d<1.6 ? (d<1 ? (1-d*0.45).toFixed(2) : (0.55*(1.6-d)/0.6).toFixed(2)) : 0);
    const tl=it.gate?0:tilt*(1-Math.min(1,a*0.6));
    el.style.transform=`translate3d(0,${y}px,${z}px) rotateX(${tl}deg)${d<0?` scale(${1+(-d)*0.04})`:''}`;
    el.style.opacity=op; el.style.filter=blur>0.05?`blur(${blur}px)`:'';
    if(!it.gate){ el.querySelector('.dim').style.opacity=dim; el.querySelector('.sheen').style.opacity=Math.max(0,1-a*2)*0.9; }
  }
  renderDock();
  const cur=Math.max(0,Math.min(N-1,Math.round(pos)));
}
function tick(){
  if(!dragging){
    if(mode==='grid'){
      ovScroll+=ovVel; ovVel*=0.93;
      const max=Math.max(0,OV.total-380);
      if(ovScroll<0){ ovScroll+=(0-ovScroll)*0.25; } if(ovScroll>max){ ovScroll+=(max-ovScroll)*0.25; }
      if(Math.abs(ovVel)<0.05&&ovScroll>=0&&ovScroll<=max){ render(); return; }
    }else if(target==null){
      pos+=vel; vel*=0.95;
      if(pos<0){ vel*=0.6; pos+=(0-pos)*0.25; }
      if(pos>N-1){ vel*=0.6; pos+=(N-1-pos)*0.25; }
      if(Math.abs(vel)<0.004){ target=Math.round(Math.max(0,Math.min(N-1,pos))); }
    }else{
      const diff=target-pos; pos+=diff*0.12;
      if(Math.abs(diff)<0.0005&&Math.abs(tilt)<0.05){ pos=target; target=null; vel=0; tilt=0; render(); return; }
    }
  }
  render(); raf=requestAnimationFrame(tick);
}
function kick(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
function setMode(m){
  mode=m; app.className='app '+(m==='flow'?'':'m-'+m);
  stage.classList.add('anim'); setTimeout(()=>stage.classList.remove('anim'),600);
  if(m==='grid'){ const i=Math.round(pos); ovScroll=Math.max(0,Math.min(Math.max(0,OV.total-380),ovPos[i].y-80)); ovVel=0; }
  renderBar(); target=null; vel=0; kick();
}

const PITCH=140;
stage.addEventListener('pointerdown',e=>{ if(e.target.closest('.ask span')) return; dragging=true; target=null; vel=0; ovVel=0; lastY=e.clientY; lastT=performance.now(); stage.setPointerCapture(e.pointerId); moved=0; });
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dy=e.clientY-lastY, now=performance.now(), dt=Math.max(1,now-lastT);
  if(mode==='grid'){ ovScroll-=dy; ovVel=-dy*(16/dt); }
  else{ let step=-dy/PITCH; if(pos<0||pos>N-1) step*=0.35; pos+=step; vel=(-dy/PITCH)*(16/dt); tiltV=Math.max(-5,Math.min(5,-vel*28)); }
  lastY=e.clientY; lastT=now; moved+=Math.abs(dy); render();
});
stage.addEventListener('pointerup',e=>{
  dragging=false;
  if(moved<6){
    const hit=document.elementFromPoint(e.clientX,e.clientY); const c=hit&&hit.closest('.card,.gate'); const onAsk=hit&&hit.closest('.ask span');
    if(c){ const i=+c.dataset.i;
      if(mode==='grid'){ setMode('flow'); pos=i; render(); return; }
      if(i===Math.round(pos)){ if(!ITEMS[i].gate){ const wasAsk=c.classList.contains('ask'); els.forEach(x=>x.classList.remove('ask')); if(wasAsk||onAsk) openDetail(i); else { c.classList.add('ask'); c._askT=performance.now(); } } } else { els.forEach(x=>x.classList.remove('ask')); target=i; kick(); } }
    return;
  }
  if(mode==='grid'){ ovVel=Math.max(-40,Math.min(40,ovVel)); } else { vel=Math.max(-0.35,Math.min(0.35,vel)); }
  kick();
});
