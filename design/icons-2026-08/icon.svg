<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="티켓 보관함">
  <!-- ticket-bots(KTX) 아이콘 결: 전면 그라데이션 바탕 + 큰 티켓 + 광택·그림자로 깊이. 이 파일이 단일 원본.
       tools/build-icons.mjs 가 icon-512/192/180 + maskable(글리프 0.86 축소) 을 굽는다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a4a"/><stop offset=".55" stop-color="#ff5a1f"/><stop offset="1" stop-color="#f0300c"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="14%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eeeef3"/>
    </linearGradient>
    <linearGradient id="stub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2ea"/><stop offset="1" stop-color="#f6dccd"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <!-- 본문: 왼쪽 가장자리 위·아래 노치(절취 흔적) -->
    <mask id="body"><rect x="-96" y="-98" width="266" height="196" rx="30" fill="#fff"/><circle cx="-96" cy="-98" r="20" fill="#000"/><circle cx="-96" cy="98" r="20" fill="#000"/></mask>
    <!-- 스텁: 오른쪽 가장자리 위·아래 노치 + 점선 구멍 -->
    <mask id="stubm"><rect x="-118" y="-98" width="118" height="196" rx="30" fill="#fff"/><circle cx="0" cy="-98" r="20" fill="#000"/><circle cx="0" cy="98" r="20" fill="#000"/>
      <circle cx="-6" cy="-58" r="5" fill="#000"/><circle cx="-6" cy="-29" r="5" fill="#000"/><circle cx="-6" cy="0" r="5" fill="#000"/><circle cx="-6" cy="29" r="5" fill="#000"/><circle cx="-6" cy="58" r="5" fill="#000"/></mask>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g id="glyph" transform="translate(266 262) scale(.9)">
    <!-- 바닥 그림자 -->
    <g transform="rotate(-8)"><rect x="-120" y="-82" width="270" height="196" rx="30" fill="#7a1c05" opacity=".38" filter="url(#shadow)"/></g>
    <!-- 뜯어낸 스텁: 살짝 더 기울고 떨어져 있음 -->
    <g transform="translate(-118 6) rotate(-16)">
      <rect x="-118" y="-90" width="118" height="196" rx="30" fill="#7a1c05" opacity=".35" filter="url(#shadow2)"/>
      <g mask="url(#stubm)"><rect x="-118" y="-98" width="118" height="196" fill="url(#stub)"/></g>
      <circle cx="-62" cy="-30" r="17" fill="#ff5a1f"/>
      <rect x="-90" y="10" width="56" height="12" rx="6" fill="#ff5a1f" opacity=".45"/>
      <rect x="-90" y="34" width="36" height="12" rx="6" fill="#ff5a1f" opacity=".3"/>
    </g>
    <!-- 본문 -->
    <g transform="translate(-10 0) rotate(-8)">
      <g mask="url(#body)">
        <rect x="-96" y="-98" width="266" height="196" fill="url(#paper)"/>
        <rect x="-96" y="-98" width="266" height="196" fill="url(#sheen)"/>
      </g>
      <rect x="-56" y="-54" width="128" height="18" rx="9" fill="#16161a"/>
      <rect x="-56" y="-16" width="176" height="16" rx="8" fill="#c9c9d2"/>
      <rect x="-56" y="16" width="96" height="16" rx="8" fill="#c9c9d2"/>
      <rect x="-56" y="52" width="58" height="24" rx="12" fill="#ff5a1f"/>
      <rect x="10" y="52" width="24" height="24" rx="12" fill="#ffe0d1"/>
    </g>
  </g>
</svg>
